<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito Matematica RPG</title>
    <style>
        /* CSS INTERNO - NESSUNA DIPENDENZA ESTERNA */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 10px 10px 0px #000;
            border: 3px solid #000;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 2px solid #000;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: 2px solid #000;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        .hidden { display: none; }

        .quiz-option {
            background: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border: 2px solid #000;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .quiz-option:hover { background: #eef2ff; }

        .registro-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .grade-tag {
            background: #000;
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- HEADER -->
        <div id="header">
            <h1>Liceo RPG</h1>
            <p class="subtitle">Analisi Matematica I</p>
        </div>

        <!-- SCHERMATA LOGIN -->
        <div id="view-login">
            <input id="std-name" type="text" placeholder="Tuo Nome">
            <button onclick="startQuiz()">Inizia il Test</button>
            <p style="margin-top: 20px; font-size: 0.8rem;">
                <a href="#" onclick="showProf()" style="color: #4f46e5; font-weight: bold; text-decoration: none;">Accesso Docente</a>
            </p>
        </div>

        <!-- SCHERMATA QUIZ -->
        <div id="view-quiz" class="hidden">
            <p id="q-count" style="font-weight: bold; color: #4f46e5;"></p>
            <h2 id="q-text" style="margin-bottom: 1.5rem;"></h2>
            <div id="options-list"></div>
        </div>

        <!-- SCHERMATA REGISTRO -->
        <div id="view-prof" class="hidden">
            <h2 style="text-transform: uppercase;">Registro Voti</h2>
            <div id="voti-container" style="margin-bottom: 20px;">
                <p style="color: #999; font-style: italic;">Nessun dato.</p>
            </div>
            <button onclick="showLogin()" style="background: #000;">Torna Indietro</button>
        </div>
    </div>

    <script>
        // DATI LOCALE (Senza Firebase)
        const domande = [
            { q: "Qual è la derivata di x²?", a: ["x", "2x", "2", "x²"], c: 1 },
            { q: "Il limite di 1/x per x che tende a infinito è:", a: ["Infinito", "1", "0", "E"], c: 2 },
            { q: "Qual è la radice quadrata di 144?", a: ["12", "14", "16", "10"], c: 0 }
        ];

        let indexCorrente = 0;
        let punteggio = 0;
        let nomeUtente = "";
        let registroVoti = []; // Simulazione database in memoria

        function showLogin() {
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('view-quiz').classList.add('hidden');
            document.getElementById('view-prof').classList.add('hidden');
            document.getElementById('header').classList.remove('hidden');
        }

        function showProf() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-prof').classList.remove('hidden');
            const cont = document.getElementById('voti-container');
            
            if(registroVoti.length === 0) {
                cont.innerHTML = "<p>Nessun voto presente.</p>";
            } else {
                cont.innerHTML = registroVoti.map(v => `
                    <div class="registro-item">
                        <span>${v.nome}</span>
                        <span class="grade-tag">${v.voto}</span>
                    </div>
                `).join('');
            }
        }

        function startQuiz() {
            nomeUtente = document.getElementById('std-name').value;
            if(!nomeUtente) { alert("Inserisci il nome!"); return; }
            
            indexCorrente = 0;
            punteggio = 0;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('header').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            caricaDomanda();
        }

        function caricaDomanda() {
            const data = domande[indexCorrente];
            document.getElementById('q-count').innerText = `DOMANDA ${indexCorrente + 1} DI ${domande.length}`;
            document.getElementById('q-text').innerText = data.q;
            
            const list = document.getElementById('options-list');
            list.innerHTML = "";
            
            data.a.forEach((opt, i) => {
                const d = document.createElement('div');
                d.className = "quiz-option";
                d.innerText = opt;
                d.onclick = () => controllaRisposta(i);
                list.appendChild(d);
            });
        }

        function controllaRisposta(i) {
            if(i === domande[indexCorrente].c) punteggio++;
            
            if(indexCorrente < domande.length - 1) {
                indexCorrente++;
                caricaDomanda();
            } else {
                concludiQuiz();
            }
        }

        function concludiQuiz() {
            const votoFinale = ((punteggio / domande.length) * 10).toFixed(1);
            alert(`Test completato, ${nomeUtente}! Il tuo voto è: ${votoFinale}`);
            
            // Salvataggio nel registro temporaneo
            registroVoti.push({ nome: nomeUtente, voto: votoFinale });
            
            showLogin();
        }
    </script>
</body>
</html>
