<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Matematica - Esame</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --p: #1e293b; --s: #3b82f6; --bg: #f1f5f9; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; position: relative; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--p); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .opt { border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; }
        .opt:hover { background: #f8fafc; border-color: var(--s); }
        #debug-status { position: absolute; top: 10px; right: 10px; font-size: 10px; padding: 4px; border-radius: 4px; font-weight: bold; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="box">
    <div id="debug-status" class="offline">DB DISCONNESSO</div>
    
    <div id="v-login">
        <h2>Analisi Matematica I</h2>
        <input id="nome" type="text" placeholder="Cognome e Nome">
        <button type="button" onclick="avviaTest()" style="width:100%">AVVIA SESSIONE ESAME</button>
    </div>

    <div id="v-quiz" class="hidden">
        <h3 id="q-testo"></h3>
        <div id="q-opzioni"></div>
    </div>

    <div id="v-res" class="hidden">
        <h2>Esito</h2>
        <div id="voto-finale" style="font-size:48px; font-weight:bold;"></div>
        <div id="lista-voti" style="margin-top:20px; text-align:left;"></div>
        <button onclick="location.reload()" style="width:100%; background:#64748b; margin-top:20px;">ESCI</button>
    </div>
</div>

<script>
    // --- INSERISCI I TUOI DATI QUI SOTTO SE IL DATABASE NON SI COLLEGA ---
    const MY_MANUAL_CONFIG = {
          apiKey: "AIzaSyDDHFGjW_oiCiP7MhdBRq9vqWHAvjTfDws",
  authDomain: "compito-di-mate.firebaseapp.com",
  projectId: "compito-di-mate",
  storageBucket: "compito-di-mate.firebasestorage.app",
  messagingSenderId: "306562904610",
  appId: "1:306562904610:web:c80a54eea6157e7108507b",
  measurementId: "G-MHV0KWER9G"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'analisi-final-v3';
    let db = null;
    let isFirebaseReady = false;

    function initFirebase() {
        const statusEl = document.getElementById('debug-status');
        try {
            // Cerchiamo di usare la configurazione automatica, altrimenti usiamo quella manuale
            let config;
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                config = JSON.parse(__firebase_config);
            } else {
                config = MY_MANUAL_CONFIG;
            }

            if (!config.apiKey || config.apiKey === "INSERISCI_QUI") {
                throw "Configurazione mancante";
            }

            firebase.initializeApp(config);
            db = firebase.firestore();
            
            firebase.auth().signInAnonymously().then(() => {
                isFirebaseReady = true;
                statusEl.innerText = "DB CONNESSO";
                statusEl.className = "online";
            }).catch(e => {
                statusEl.innerText = "ERRORE AUTH";
            });
        } catch (e) {
            statusEl.innerText = "DB OFFLINE (SOLO LOCALE)";
            statusEl.className = "offline";
        }
    }

    const domande = [
        { q: "Limite per x→0 di (eˣ-1)/x?", a: ["0", "1", "e", "∞"], c: 1 },
        { q: "Derivata di ln(x)?", a: ["eˣ", "1/x", "x", "1"], c: 1 }
    ];

    let indice = 0, punti = 0, utente = "";

    function avviaTest() {
        utente = document.getElementById('nome').value.trim();
        if (utente.length < 3) return alert("Inserisci il nome.");
        indice = 0; punti = 0;
        document.getElementById('v-login').classList.add('hidden');
        document.getElementById('v-quiz').classList.remove('hidden');
        mostraDomanda();
    }

    function mostraDomanda() {
        const d = domande[indice];
        document.getElementById('q-testo').innerText = d.q;
        const container = document.getElementById('q-opzioni');
        container.innerHTML = "";
        d.a.forEach((testo, i) => {
            const div = document.createElement('div');
            div.className = "opt";
            div.innerText = testo;
            div.onclick = () => {
                if(i === d.c) punti++;
                if(++indice < domande.length) mostraDomanda();
                else fineTest();
            };
            container.appendChild(div);
        });
    }

    function fineTest() {
        const voto = ((punti / domande.length) * 10).toFixed(1);
        document.getElementById('voto-finale').innerText = voto + "/10";
        document.getElementById('v-quiz').classList.add('hidden');
        document.getElementById('v-res').classList.remove('hidden');
        
        if (isFirebaseReady && db) {
            const path = `artifacts/${appId}/public/data/voti`;
            db.collection(path).add({
                nome: utente,
                voto: parseFloat(voto),
                data: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => caricaVoti());
        }
    }

    function caricaVoti() {
        if (!db) return;
        const path = `artifacts/${appId}/public/data/voti`;
        db.collection(path).orderBy("data", "desc").limit(5).get().then(snap => {
            let html = "<strong>Ultimi voti:</strong><br>";
            snap.forEach(doc => {
                const d = doc.data();
                html += `<div>${d.nome}: ${d.voto}</div>`;
            });
            document.getElementById('lista-voti').innerHTML = html;
        });
    }

    window.onload = initFirebase;
</script>
</body>
</html>
