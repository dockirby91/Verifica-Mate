<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compito Mate - Analisi Matematica Completa</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #2d3748; }
        .container { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 10px 10px 0px #000; border: 3px solid #000; width: 95%; max-width: 600px; text-align: center; }
        .subtitle { color: #4f46e5; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 2rem; }
        input { width: 100%; padding: 14px; margin-bottom: 1rem; border: 3px solid #000; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #4f46e5; color: white; border: 3px solid #000; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px #000; text-transform: uppercase; transition: all 0.1s; margin-bottom: 0.5rem; }
        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px #000; }
        .btn-ai { background-color: #8b5cf6; }
        .hidden { display: none; }
        .quiz-option { background: #fff; margin-bottom: 10px; padding: 15px; border: 3px solid #000; border-radius: 12px; cursor: pointer; font-weight: 600; text-align: left; }
        .quiz-option:hover { background: #f1f5f9; }
        #ai-response-area, #ai-report-area { background: #f5f3ff; border: 2px dashed #8b5cf6; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; font-size: 0.9rem; max-height: 250px; overflow-y: auto; white-space: pre-wrap; }
        
        /* Leaderboard Style */
        .leaderboard { margin-top: 2rem; border-top: 3px solid #000; padding-top: 1rem; text-align: left; }
        .leaderboard-title { font-weight: 900; text-transform: uppercase; font-size: 0.9rem; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .score-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 2px solid #e2e8f0; font-size: 0.95rem; background: #fff; margin-bottom: 4px; border-radius: 8px; border: 1px solid #eee; }
        .badge { background: #000; color: white; padding: 2px 10px; border-radius: 6px; font-weight: bold; }
        
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(139, 92, 246, 0.3); border-radius: 50%; border-top-color: #8b5cf6; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="header">
            <h1 style="text-transform: uppercase; font-style: italic; font-size: 1.8rem; margin:0;">Compito Mate</h1>
            <p class="subtitle">Analisi Matematica - Community Edition</p>
        </div>

        <!-- LOGIN -->
        <div id="view-login">
            <input id="std-name" type="text" placeholder="Nome Studente (es. Bellaragà)">
            <button onclick="startQuiz()">Entra in Battaglia</button>
            <p onclick="showView('view-prof-auth')" style="cursor:pointer; text-decoration:underline; font-size:0.8rem; margin-top:15px; color: #718096;">Accesso Cattedra</p>
        </div>

        <!-- AUTH DOCENTE -->
        <div id="view-prof-auth" class="hidden">
            <h3>LOG-IN DOCENTE</h3>
            <input id="prof-pass" type="password" placeholder="Password">
            <button onclick="checkAuth()">Apri Registro</button>
            <p onclick="showView('view-login')" style="cursor:pointer; text-decoration:underline; font-size:0.8rem;">Indietro</p>
        </div>

        <!-- QUIZ -->
        <div id="view-quiz" class="hidden">
            <p id="q-info" style="font-size: 0.75rem; font-weight: bold; color: #4f46e5;"></p>
            <h2 id="q-text" style="font-size: 1.2rem; margin-bottom: 1.5rem; line-height: 1.4;"></h2>
            <div id="options-container"></div>
        </div>

        <!-- RISULTATO E BACHECA -->
        <div id="view-result" class="hidden">
            <h2>Missione Compiuta!</h2>
            <div id="final-score-display" style="font-size: 3.5rem; font-weight: 900; margin: 0.5rem 0;"></div>
            
            <button onclick="getAiFeedback()" class="btn-ai">Ascolta il Saggio AI ✨</button>
            <div id="ai-response-area" class="hidden"></div>

            <div class="leaderboard">
                <div class="leaderboard-title">📜 Pergamena dei Risultati (Classe)</div>
                <div id="student-leaderboard-list" style="max-height: 300px; overflow-y: auto;">
                    <p style="font-size: 0.8rem; color: #718096;">Caricamento bacheca...</p>
                </div>
            </div>

            <button onclick="location.reload()" style="background: #000; margin-top: 15px;">Ricomincia</button>
        </div>

        <!-- REGISTRO PROF -->
        <div id="view-prof" class="hidden">
            <h2 style="text-transform: uppercase;">Registro Voti Docente</h2>
            <div id="voti-list-prof" style="margin-bottom: 20px; max-height: 300px; overflow-y: auto;"></div>
            <button onclick="generateClassReport()" class="btn-ai">Genera Analisi Classe AI ✨</button>
            <div id="ai-report-area" class="hidden"></div>
            <button onclick="location.reload()" style="background: #000; margin-top: 10px;">Esci</button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'Verifica-mate-v1';
        const firebaseConfig = JSON.parse(__firebase_config);
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
        };
        initAuth().catch(console.error);

        const dataset = [
            { q: "Qual è il limite per x → 0 di (eˣ - 1) / x?", a: ["0", "1", "∞", "Non esiste"], c: 1, topic: "Limiti Notevoli" },
            { q: "Una funzione f(x) è continua in x₀ se:", a: ["Esiste f(x₀)", "Il limite destro e sinistro coincidono con f(x₀)", "La derivata è positiva", "f(x₀) è positiva"], c: 1, topic: "Continuità" },
            { q: "Data f(x) = x², qual è il coefficiente angolare della tangente in x = 3?", a: ["3", "6", "9", "0"], c: 1, topic: "Derivate" },
            { q: "Se f'(x) > 0 in un intervallo, la funzione è:", a: ["Costante", "Crescente", "Decrescente", "Concava"], c: 1, topic: "Studio di Funzione" },
            { q: "Cosa indica un punto in cui f''(x) = 0 e cambia segno?", a: ["Massimo", "Minimo", "Flesso", "Asintoto"], c: 2, topic: "Studio di Funzione" },
            { q: "Qual è la derivata di f(x) = ln(x)?", a: ["eˣ", "x", "1/x", "1"], c: 2, topic: "Derivate" },
            { q: "Il limite per x → ∞ di (3x² + 2) / (x² - 1) è:", a: ["0", "2", "3", "∞"], c: 2, topic: "Limiti" },
            { q: "Quale tipo di discontinuità presenta f(x) = sin(x)/x in x = 0?", a: ["1° specie (salto)", "2° specie (infinito)", "3° specie (eliminabile)", "È continua"], c: 2, topic: "Continuità" },
            { q: "La derivata del prodotto [f(x)g(x)]' è:", a: ["f'g + fg'", "f'g'", "f' + g'", "fg' - f'g"], c: 0, topic: "Derivate" },
            { q: "La funzione f(x) = |x| è derivabile in x = 0?", a: ["Sì", "No", "Solo se x > 0", "Sì, vale 0"], c: 1, topic: "Derivate" }
        ];

        let score = 0, currentIdx = 0, studentName = "", wrongAnswers = [];

        async function callGemini(prompt, system) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < 5; i++) {
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: system }] }
                        })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Risposta vuota.";
                    }
                } catch (e) { if (i === 4) return "Connessione IA fallita."; }
                await new Promise(r => setTimeout(r, delays[i]));
            }
            return "IA non risponde.";
        }

        function showView(id) {
            document.querySelectorAll('.container > div').forEach(v => v.classList.add('hidden'));
            document.getElementById('header').classList.remove('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function checkAuth() {
            if(document.getElementById('prof-pass').value === "ProfDoc2026") {
                showView('view-prof');
                loadLeaderboard('voti-list-prof');
            } else { alert("Accesso negato!"); }
        }

        function startQuiz() {
            studentName = document.getElementById('std-name').value.trim();
            if(!studentName) return alert("Inserisci un nome!");
            currentIdx = 0; score = 0; wrongAnswers = [];
            showView('view-quiz');
            renderQ();
        }

        function renderQ() {
            const d = dataset[currentIdx];
            document.getElementById('q-info').innerText = `QUESITO ${currentIdx + 1}/${dataset.length}`;
            document.getElementById('q-text').innerText = d.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            d.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = "quiz-option";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(i === d.c) score++;
                    else wrongAnswers.push({q: d.q, topic: d.topic, correct: d.a[d.c], yours: opt});
                    if(++currentIdx < dataset.length) renderQ();
                    else finishTest();
                };
                container.appendChild(btn);
            });
        }

        async function finishTest() {
            const grade = ((score / dataset.length) * 10).toFixed(1);
            document.getElementById('final-score-display').innerText = `${grade}/10`;
            showView('view-result');
            
            if (auth.currentUser) {
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('voti').add({
                        name: studentName,
                        grade: parseFloat(grade),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        wrongData: JSON.stringify(wrongAnswers)
                    });
                    loadLeaderboard('student-leaderboard-list');
                } catch(e) { console.error(e); }
            }
        }

        function loadLeaderboard(targetId) {
            const ref = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('voti');
            ref.onSnapshot(snap => {
                const container = document.getElementById(targetId);
                let list = [];
                snap.forEach(doc => list.push(doc.data()));
                
                list.sort((a, b) => (b.grade || 0) - (a.grade || 0));
                window.currentClassData = list; // Per report AI

                container.innerHTML = list.map(d => `
                    <div class="score-row">
                        <span>👤 <b>${d.name}</b></span>
                        <span class="badge">${d.grade}/10</span>
                    </div>
                `).join('') || "Nessuno studente ancora registrato.";
            });
        }

        async function getAiFeedback() {
            const area = document.getElementById('ai-response-area');
            area.classList.remove('hidden');
            area.innerHTML = `<div class="loading-spinner"></div> Consultazione alchemica...`;
            const prompt = `Studente: ${studentName}. Voto: ${score}/${dataset.length}. Errori: ${JSON.stringify(wrongAnswers)}. Sii un saggio maestro RPG e incoraggia lo studente.`;
            area.innerHTML = `✨ <b>Il Saggio:</b><br>${await callGemini(prompt, "Sei un precettore medievale di matematica.")}`;
        }

        async function generateClassReport() {
            const area = document.getElementById('ai-report-area');
            area.classList.remove('hidden');
            area.innerHTML = `<div class="loading-spinner"></div> Studio statistico in corso...`;
            const prompt = `Analizza questi dati della classe: ${JSON.stringify(window.currentClassData)}. Fornisci un report professionale su cosa ripassare.`;
            area.innerHTML = `📊 <b>Analisi Docente:</b><br>${await callGemini(prompt, "Sei un esperto di analisi matematica.")}`;
        }
    </script>
</body>
</html>
