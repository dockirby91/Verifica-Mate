<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Matematica RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neo-box { border: 3px solid black; box-shadow: 5px 5px 0px black; }
        .active-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px black; }
    </style>
</head>
<body class="bg-blue-50 p-6 font-sans">

    <div id="app" class="max-w-md mx-auto">
        <!-- HEADER -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black italic uppercase tracking-tighter">Liceo RPG</h1>
            <p class="text-gray-500 font-bold text-xs uppercase tracking-widest">Versione Offline (No Cloud)</p>
        </div>

        <!-- SCHERMATA LOGIN -->
        <div id="view-login" class="bg-white p-8 rounded-2xl neo-box">
            <input id="name-input" type="text" placeholder="Tuo Nome" class="w-full p-4 border-2 border-black rounded-xl mb-4 outline-none focus:bg-yellow-50">
            <button onclick="startQuiz()" class="w-full bg-indigo-600 text-white font-black p-4 rounded-xl neo-box active-btn uppercase tracking-widest">Inizia il Test</button>
            
            <div class="mt-8 pt-6 border-t-2 border-dashed border-gray-200">
                <p class="text-[10px] text-gray-400 font-bold uppercase mb-2">Accesso Riservato</p>
                <button onclick="showProf()" class="text-xs font-black text-indigo-400 hover:text-indigo-600 uppercase">Registro Docente</button>
            </div>
        </div>

        <!-- SCHERMATA QUIZ -->
        <div id="view-quiz" class="hidden bg-white p-8 rounded-2xl neo-box">
            <div id="progress" class="text-[10px] font-black text-indigo-600 mb-2 uppercase">Domanda 1/3</div>
            <h2 id="question" class="text-2xl font-bold mb-6 italic">Caricamento...</h2>
            <div id="options" class="flex flex-col gap-3"></div>
        </div>

        <!-- SCHERMATA REGISTRO (LOCALE) -->
        <div id="view-prof" class="hidden bg-white p-8 rounded-2xl neo-box">
            <h2 class="text-xl font-black mb-4 uppercase italic">Voti della Sessione</h2>
            <p class="text-[10px] text-gray-400 mb-4 uppercase">Nota: Senza Cloud, i voti si cancellano se ricarichi la pagina.</p>
            <div id="voti-list" class="space-y-2 mb-6">
                <!-- Voti qui -->
            </div>
            <button onclick="showLogin()" class="w-full bg-black text-white p-3 rounded-xl font-bold uppercase text-xs">Torna Indietro</button>
        </div>
    </div>

    <script>
        const QUESTIONS = [
            { q: "Derivata di x²?", a: ["x", "2x", "2", "x²"], c: 1 },
            { q: "lim(x→∞) 1/x?", a: ["∞", "1", "0", "e"], c: 2 },
            { q: "Quanto fa 15 x 3?", a: ["45", "35", "55", "60"], c: 0 }
        ];

        let currentIdx = 0;
        let score = 0;
        let studentName = "";
        
        // Array locale per simulare il database
        let registroLocale = [];

        function showLogin() {
            document.querySelectorAll('#app > div').forEach(d => d.id !== 'app' && d.classList.add('hidden'));
            document.getElementById('view-login').classList.remove('hidden');
        }

        function showProf() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-prof').classList.remove('hidden');
            updateRegistroUI();
        }

        function startQuiz() {
            studentName = document.getElementById('name-input').value.trim();
            if(!studentName) return alert("Inserisci il nome!");
            
            currentIdx = 0;
            score = 0;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const data = QUESTIONS[currentIdx];
            document.getElementById('progress').innerText = `Domanda ${currentIdx + 1}/${QUESTIONS.length}`;
            document.getElementById('question').innerText = data.q;
            
            const container = document.getElementById('options');
            container.innerHTML = "";
            
            data.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "p-4 border-2 border-black rounded-xl font-bold text-left hover:bg-indigo-50 active-btn transition-colors";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(i === data.c) score++;
                    if(currentIdx < QUESTIONS.length - 1) {
                        currentIdx++;
                        renderQuestion();
                    } else {
                        finishQuiz();
                    }
                };
                container.appendChild(btn);
            });
        }

        function finishQuiz() {
            const grade = ((score / QUESTIONS.length) * 10).toFixed(1);
            alert(`Complimenti ${studentName}! Hai preso ${grade}`);
            
            // Salvataggio nel database locale (solo per questa sessione)
            registroLocale.push({ name: studentName, grade: grade, date: new Date().toLocaleTimeString() });
            
            showLogin();
        }

        function updateRegistroUI() {
            const list = document.getElementById('voti-list');
            if(registroLocale.length === 0) {
                list.innerHTML = "<p class='text-gray-400 italic text-sm text-center py-4'>Nessun voto registrato.</p>";
                return;
            }
            
            list.innerHTML = registroLocale.map(item => `
                <div class="flex justify-between items-center p-3 border-2 border-black rounded-lg bg-indigo-50">
                    <div>
                        <p class="font-black text-sm uppercase">${item.name}</p>
                        <p class="text-[8px] text-gray-500 uppercase">${item.date}</p>
                    </div>
                    <div class="text-xl font-black text-indigo-600">${item.grade}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
