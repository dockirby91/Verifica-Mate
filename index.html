<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Matematica - Portale Docente/Studente</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #2563eb;
            --bg: #f8fafc;
            --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #1e293b; }
        .container { background: white; padding: 2rem; border-radius: 8px; border: 1px solid var(--border); width: 90%; max-width: 550px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { border-bottom: 2px solid var(--bg); margin-bottom: 1.5rem; padding-bottom: 1rem; }
        h1 { margin: 0; font-size: 1.4rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .subtitle { font-size: 0.85rem; color: #64748b; font-weight: 600; }
        
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 4px; font-size: 1rem; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--secondary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s; margin-bottom: 0.5rem; }
        button:hover { opacity: 0.9; }
        .btn-alt { background: var(--secondary); }
        
        .hidden { display: none; }
        
        .quiz-option { border: 1px solid var(--border); margin-bottom: 0.6rem; padding: 1rem; border-radius: 6px; cursor: pointer; transition: background 0.2s; text-align: left; }
        .quiz-option:hover { background-color: #f1f5f9; }
        
        #ai-box { background: #f1f5f9; border-left: 4px solid var(--secondary); padding: 1rem; border-radius: 4px; margin-top: 1rem; text-align: left; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }

        .leaderboard { margin-top: 1.5rem; text-align: left; border-top: 1px solid var(--border); padding-top: 1rem; }
        .leaderboard-title { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; color: #64748b; margin-bottom: 0.8rem; }
        .score-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #f1f5f9; }
        .badge { background: #334155; color: white; padding: 2px 8px; border-radius: 3px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Sessione d'Esame Digitale</h1>
            <div class="subtitle">ANALISI MATEMATICA I - ARCHIVIO RISULTATI</div>
        </div>

        <!-- LOGIN -->
        <div id="view-login">
            <input id="std-name" type="text" placeholder="Cognome e Nome">
            <button onclick="startQuiz()">Inizia Valutazione</button>
            <p onclick="showView('view-prof-auth')" style="cursor:pointer; text-decoration:underline; font-size:0.75rem; text-align:center; color: #64748b; margin-top: 1rem;">Accesso Amministrativo Docente</p>
        </div>

        <!-- AUTH DOCENTE -->
        <div id="view-prof-auth" class="hidden">
            <h3 style="margin-top:0; font-size:1rem;">Area Riservata Docente</h3>
            <input id="prof-pass" type="password" placeholder="Inserire Password">
            <button onclick="checkAuth()">Accedi al Registro</button>
            <button onclick="showView('view-login')" style="background:#64748b">Annulla</button>
        </div>

        <!-- QUIZ -->
        <div id="view-quiz" class="hidden">
            <div id="q-info" style="font-size: 0.75rem; font-weight: 700; color: var(--secondary); margin-bottom: 0.4rem;"></div>
            <h2 id="q-text" style="font-size: 1.1rem; margin-bottom: 1.2rem;"></h2>
            <div id="options-container"></div>
        </div>

        <!-- RISULTATI -->
        <div id="view-result" class="hidden">
            <h2 style="margin-top:0; font-size: 1.2rem;">Esito Valutazione</h2>
            <div id="final-score-display" style="font-size: 3.5rem; font-weight: 800; color: var(--primary);"></div>
            
            <button onclick="getAiFeedback()" class="btn-alt">Richiedi Analisi Didattica IA ✨</button>
            <div id="ai-box" class="hidden"></div>

            <div class="leaderboard">
                <div class="leaderboard-title">Bacheca Voti Studenti</div>
                <div id="student-list"></div>
            </div>

            <button onclick="location.reload()" style="background: #000; margin-top: 1rem;">Chiudi Sessione</button>
        </div>

        <!-- REGISTRO PROF -->
        <div id="view-prof" class="hidden">
            <h2 style="margin-top:0; font-size:1.2rem;">Registro Elettronico</h2>
            <div id="voti-list-prof" style="margin-bottom: 1rem; max-height: 250px; overflow-y: auto;"></div>
            <button onclick="generateClassReport()" class="btn-alt">Analisi Statistica Classe ✨</button>
            <div id="ai-box-prof" class="hidden" style="background:#f1f5f9; padding:1rem; border-radius:4px; font-size:0.9rem; text-align:left; white-space:pre-wrap;"></div>
            <button onclick="location.reload()" style="background: #64748b; margin-top: 1rem;">Log-out</button>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'analisi-pro-v2';
        const firebaseConfig = JSON.parse(__firebase_config);
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Autenticazione immediata senza fronzoli
        auth.signInAnonymously().catch(e => console.error("Errore Auth:", e));

        const dataset = [
            { q: "Qual è il limite per x → 0 di (eˣ - 1) / x?", a: ["0", "1", "∞", "Non esiste"], c: 1, topic: "Limiti" },
            { q: "Una funzione f(x) è continua in x₀ se:", a: ["Esiste f(x₀)", "Il limite destro e sinistro coincidono con f(x₀)", "La derivata è positiva", "f(x₀) è positiva"], c: 1, topic: "Continuità" },
            { q: "Data f(x) = x², qual è il coefficiente angolare della tangente in x = 3?", a: ["3", "6", "9", "0"], c: 1, topic: "Derivate" },
            { q: "Se f'(x) > 0 in un intervallo, la funzione è:", a: ["Costante", "Crescente", "Decrescente", "Concava"], c: 1, topic: "Derivate" },
            { q: "Cosa indica un punto in cui f''(x) = 0 e cambia segno?", a: ["Massimo", "Minimo", "Flesso", "Asintoto"], c: 2, topic: "Studio Funzione" },
            { q: "Qual è la derivata di f(x) = ln(x)?", a: ["eˣ", "x", "1/x", "1"], c: 2, topic: "Derivate" },
            { q: "Il limite per x → ∞ di (3x² + 2) / (x² - 1) è:", a: ["0", "2", "3", "∞"], c: 2, topic: "Limiti" },
            { q: "Quale tipo di discontinuità presenta f(x) = sin(x)/x in x = 0?", a: ["1° specie", "2° specie", "3° specie (eliminabile)", "È continua"], c: 2, topic: "Continuità" },
            { q: "La derivata del prodotto [f(x)g(x)]' è:", a: ["f'g + fg'", "f'g'", "f' + g'", "fg' - f'g"], c: 0, topic: "Derivate" },
            { q: "La funzione f(x) = |x| è derivabile in x = 0?", a: ["Sì", "No", "Solo se x > 0", "Sì, ha valore 0"], c: 1, topic: "Continuità" }
        ];

        let score = 0, currentIdx = 0, studentName = "", wrongAnswers = [];

        async function callGemini(prompt, system) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: system }] }
                    })
                });
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Errore nel servizio IA.";
            } catch (e) { return "IA temporaneamente non disponibile."; }
        }

        function showView(id) {
            document.querySelectorAll('.container > div:not(.header)').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function checkAuth() {
            if(document.getElementById('prof-pass').value === "ProfDoc2026") {
                showView('view-prof');
                loadLeaderboard('voti-list-prof');
            } else { alert("Password Errata."); }
        }

        function startQuiz() {
            studentName = document.getElementById('std-name').value.trim();
            if(!studentName) return alert("Inserire Nome e Cognome.");
            currentIdx = 0; score = 0; wrongAnswers = [];
            showView('view-quiz');
            renderQ();
        }

        function renderQ() {
            const d = dataset[currentIdx];
            document.getElementById('q-info').innerText = `DOMANDA ${currentIdx + 1} / ${dataset.length}`;
            document.getElementById('q-text').innerText = d.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            d.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = "quiz-option";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(i === d.c) score++;
                    else wrongAnswers.push({q: d.q, topic: d.topic, correct: d.a[d.c], yours: opt});
                    if(++currentIdx < dataset.length) renderQ();
                    else finishTest();
                };
                container.appendChild(btn);
            });
        }

        async function finishTest() {
            const grade = ((score / dataset.length) * 10).toFixed(1);
            document.getElementById('final-score-display').innerText = `${grade}/10`;
            showView('view-result');
            
            try {
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('voti').add({
                    name: studentName,
                    grade: parseFloat(grade),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    errors: JSON.stringify(wrongAnswers)
                });
                loadLeaderboard('student-list');
            } catch(e) { console.error(e); }
        }

        function loadLeaderboard(targetId) {
            db.collection('artifacts').doc(appId).collection('public').doc('data').collection('voti')
                .onSnapshot(snap => {
                    const container = document.getElementById(targetId);
                    let list = [];
                    snap.forEach(doc => list.push(doc.data()));
                    list.sort((a, b) => b.grade - a.grade);
                    window.classData = list;
                    container.innerHTML = list.map(d => `
                        <div class="score-row">
                            <span>${d.name}</span>
                            <span class="badge">${d.grade}/10</span>
                        </div>
                    `).join('') || "Nessun dato.";
                });
        }

        async function getAiFeedback() {
            const area = document.getElementById('ai-box');
            area.classList.remove('hidden');
            area.innerHTML = "Generazione feedback in corso...";
            const prompt = `Studente: ${studentName}. Voto: ${score}/10. Errori: ${JSON.stringify(wrongAnswers)}. Fornisci un feedback professionale di Analisi Matematica.`;
            area.innerHTML = await callGemini(prompt, "Sei un docente universitario di Analisi Matematica.");
        }

        async function generateClassReport() {
            const area = document.getElementById('ai-box-prof');
            area.classList.remove('hidden');
            area.innerHTML = "Analisi dati classe in corso...";
            const prompt = `Analizza questi risultati: ${JSON.stringify(window.classData)}. Indica gli argomenti critici.`;
            area.innerHTML = await callGemini(prompt, "Sei un esperto di statistica accademica.");
        }
    </script>
</body>
</html>
