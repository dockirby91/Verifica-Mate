<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liceo RPG - Registro Cloud AI</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #2d3748;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 10px 10px 0px #000;
            border: 3px solid #000;
            width: 100%;
            max-width: 550px;
            text-align: center;
        }

        .subtitle {
            color: #4f46e5;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 1rem;
            border: 3px solid #000;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            color: white;
            border: 3px solid #000;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            transition: all 0.1s;
            margin-bottom: 0.5rem;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        .btn-ai { background-color: #8b5cf6; }
        .hidden { display: none; }

        .quiz-option {
            background: #fff;
            margin-bottom: 10px;
            padding: 15px;
            border: 3px solid #000;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
        }

        .quiz-option:hover { background: #f1f5f9; }

        .registro-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 2px solid #e2e8f0;
            text-align: left;
            background: #fdfdfd;
            margin-bottom: 5px;
            border-radius: 8px;
        }

        .grade-badge {
            background: #000;
            color: #fff;
            padding: 2px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        #ai-response-area {
            background: #f5f3ff;
            border: 2px dashed #8b5cf6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top-color: #8b5cf6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div id="header">
            <h1 style="text-transform: uppercase; font-style: italic; font-size: 1.8rem; margin:0;">Liceo RPG</h1>
            <p class="subtitle">Analisi Matematica - Registro Cloud</p>
        </div>

        <!-- LOGIN -->
        <div id="view-login">
            <input id="std-name" type="text" placeholder="Nome Studente">
            <button onclick="startQuiz()">Entra in Aula</button>
            <p onclick="showView('view-prof-auth')" style="cursor:pointer; text-decoration:underline; font-size:0.8rem; margin-top:15px;">Accesso Docente</p>
        </div>

        <!-- AUTH DOCENTE -->
        <div id="view-prof-auth" class="hidden">
            <h3>LOG-IN DOCENTE</h3>
            <input id="prof-pass" type="password" placeholder="Password">
            <button onclick="checkAuth()">Accedi al Registro</button>
            <p onclick="showView('view-login')" style="cursor:pointer; text-decoration:underline; font-size:0.8rem;">Indietro</p>
        </div>

        <!-- QUIZ -->
        <div id="view-quiz" class="hidden">
            <p id="q-info" style="font-size: 0.7rem; font-weight: bold; color: #4f46e5;"></p>
            <h2 id="q-text" style="font-size: 1.2rem; margin-bottom: 1.5rem;"></h2>
            <div id="options-container"></div>
        </div>

        <!-- RISULTATO -->
        <div id="view-result" class="hidden">
            <h2>Test Completato!</h2>
            <div id="final-score-display" style="font-size: 3rem; font-weight: 900; margin: 1rem 0;"></div>
            <button onclick="getAiFeedback()" class="btn-ai">Chiedi al Saggio AI ✨</button>
            <div id="ai-response-area" class="hidden"></div>
            <button onclick="location.reload()" style="background: #000; margin-top: 10px;">Torna alla Home</button>
        </div>

        <!-- REGISTRO -->
        <div id="view-prof" class="hidden">
            <h2 style="text-transform: uppercase;">Registro Voti Online</h2>
            <div id="voti-list" style="margin-bottom: 20px; max-height: 250px; overflow-y: auto;">
                <p>Caricamento dati...</p>
            </div>
            <button onclick="generateClassReport()" class="btn-ai">Genera Report AI ✨</button>
            <div id="ai-report-area" class="hidden" style="text-align: left; font-size: 0.8rem; background: #f0fdf4; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #22c55e;"></div>
            <button onclick="location.reload()" style="background: #000;">Esci</button>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE E GEMINI
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'math-rpg-v1';
        const apiKey = ""; // API Gemini

        // DATABASE PATH: /artifacts/{appId}/public/data/results
        const resultsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('results');

        const dataset = [
            { q: "Qual è il limite per x → 0 di (eˣ - 1) / x?", a: ["0", "1", "∞", "Non esiste"], c: 1, topic: "Limiti Notevoli" },
            { q: "Una funzione f(x) è continua in x₀ se:", a: ["Esiste f(x₀)", "Il limite destro e sinistro coincidono con f(x₀)", "La derivata è positiva", "f(x₀) è positiva"], c: 1, topic: "Continuità" },
            { q: "Data f(x) = x², qual è il coefficiente angolare della tangente in x = 3?", a: ["3", "6", "9", "0"], c: 1, topic: "Derivate" },
            { q: "Se f'(x) > 0 in un intervallo, la funzione è:", a: ["Costante", "Crescente", "Decrescente", "Concava"], c: 1, topic: "Studio di Funzione" },
            { q: "Cosa indica un punto in cui f''(x) = 0 e cambia segno?", a: ["Massimo", "Minimo", "Flesso", "Asintoto"], c: 2, topic: "Studio di Funzione" },
            { q: "Qual è la derivata di f(x) = ln(x)?", a: ["eˣ", "x", "1/x", "1"], c: 2, topic: "Derivate" },
            { q: "Il limite per x → ∞ di (3x² + 2) / (x² - 1) è:", a: ["0", "2", "3", "∞"], c: 2, topic: "Limiti" },
            { q: "Quale tipo di discontinuità presenta f(x) = sin(x)/x in x = 0?", a: ["1° specie (salto)", "2° specie (infinito)", "3° specie (eliminabile)", "È continua"], c: 2, topic: "Continuità" },
            { q: "La derivata del prodotto di due funzioni [f(x)g(x)]' è:", a: ["f'g + fg'", "f'g'", "f' + g'", "fg' - f'g"], c: 0, topic: "Derivate" },
            { q: "In uno studio di funzione, f(x) = 0 determina:", a: ["Asintoti verticali", "Intersezioni con l'asse x", "Massimi e minimi", "Dominio"], c: 1, topic: "Studio di Funzione" },
            { q: "Qual è la derivata di sin(x)?", a: ["cos(x)", "-cos(x)", "tan(x)", "sin(x)"], c: 0, topic: "Derivate" },
            { q: "Se lim (x→c) f(x) = ∞, x = c è un:", a: ["Asintoto orizzontale", "Asintoto verticale", "Asintoto obliquo", "Punto di massimo"], c: 1, topic: "Limiti" },
            { q: "Qual è la derivata seconda di f(x) = x³?", a: ["3x²", "6x", "6", "x"], c: 1, topic: "Derivate" },
            { q: "Una funzione f(x) è pari se:", a: ["f(-x) = f(x)", "f(-x) = -f(x)", "f(x) = 0", "La derivata è costante"], c: 0, topic: "Studio di Funzione" },
            { q: "Il teorema di Weierstrass garantisce l'esistenza di max e min se la funzione è:", a: ["Solo derivabile", "Continua su un intervallo chiuso e limitato", "Positiva", "Periodica"], c: 1, topic: "Continuità" }
        ];

        let currentIdx = 0;
        let score = 0;
        let studentName = "";
        let wrongAnswers = [];
        let allResults = [];

        // INIT AUTH
        (async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
        })();

        // GEMINI API
        async function callGemini(prompt, system) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: system }] } };
            const response = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        function showView(id) {
            document.querySelectorAll('.container > div').forEach(v => v.classList.add('hidden'));
            document.getElementById('header').classList.remove('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function checkAuth() {
            if(document.getElementById('prof-pass').value === "ProfDoc2026") {
                showView('view-prof');
                startRealtimeListener();
            } else { alert("Password errata!"); }
        }

        function startQuiz() {
            studentName = document.getElementById('std-name').value.trim();
            if(!studentName) return alert("Inserisci il tuo nome!");
            currentIdx = 0;
            score = 0;
            wrongAnswers = [];
            showView('view-quiz');
            document.getElementById('header').classList.add('hidden');
            renderQ();
        }

        function renderQ() {
            const d = dataset[currentIdx];
            document.getElementById('q-info').innerText = `QUESITO ${currentIdx + 1} / ${dataset.length}`;
            document.getElementById('q-text').innerText = d.q;
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            d.a.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = "quiz-option";
                btn.innerText = opt;
                btn.onclick = () => {
                    if(i === d.c) score++;
                    else wrongAnswers.push({q: d.q, topic: d.topic, correct: d.a[d.c], yours: opt});
                    if(currentIdx < dataset.length - 1) { currentIdx++; renderQ(); }
                    else { finishTest(); }
                };
                container.appendChild(btn);
            });
        }

        async function finishTest() {
            const grade = ((score / dataset.length) * 10).toFixed(1);
            document.getElementById('final-score-display').innerText = `${grade}/10`;
            showView('view-result');

            // SALVATAGGIO CLOUD
            const user = auth.currentUser;
            if (user) {
                await resultsRef.doc(user.uid).set({
                    name: studentName,
                    grade: grade,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    wrongData: JSON.stringify(wrongAnswers)
                });
            }
        }

        async function getAiFeedback() {
            const area = document.getElementById('ai-response-area');
            area.classList.remove('hidden');
            area.innerHTML = `<div class="loading-spinner"></div> Analisi magica in corso...`;
            
            const prompt = `Lo studente ${studentName} ha preso ${score}/${dataset.length}. Errori: ${JSON.stringify(wrongAnswers)}. Spiega brevemente gli errori e incoraggia in stile fantasy/RPG.`;
            const feedback = await callGemini(prompt, "Sei un saggio precettore di analisi matematica. Parla in italiano.");
            area.innerHTML = `✨ <b>Il Saggio dice:</b><br>${feedback}`;
        }

        function startRealtimeListener() {
            resultsRef.onSnapshot(snap => {
                const list = document.getElementById('voti-list');
                list.innerHTML = "";
                allResults = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    allResults.push(data);
                    list.innerHTML += `
                        <div class="registro-item">
                            <span><b>${data.name}</b></span>
                            <span class="grade-badge">${data.grade}</span>
                        </div>`;
                });
                if(allResults.length === 0) list.innerHTML = "In attesa di studenti...";
            });
        }

        async function generateClassReport() {
            const area = document.getElementById('ai-report-area');
            area.classList.remove('hidden');
            area.innerHTML = `<div class="loading-spinner"></div> Studio della classe in corso...`;
            
            const prompt = `Analizza questi voti della classe: ${JSON.stringify(allResults)}. Dimmi quali sono gli argomenti dove la classe zoppica e come il prof può aiutarli.`;
            const report = await callGemini(prompt, "Sei un consulente didattico esperto. Sii sintetico e utile.");
            area.innerHTML = `<b>Report Strategico AI:</b><br>${report}`;
        }
    </script>
</body>
</html>
