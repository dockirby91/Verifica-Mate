<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisi Matematica - Esame</title>
    <!-- Caricamento forzato degli SDK in modalità compatibile -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --p: #1e293b; --s: #3b82f6; --bg: #f1f5f9; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--p); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #000; }
        .hidden { display: none; }
        .opt { border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; }
        .opt:hover { background: #f8fafc; border-color: var(--s); }
        #debug-log { font-size: 10px; color: red; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="box">
    <div id="debug-log"></div>
    
    <!-- SCHERMATA LOGIN -->
    <div id="v-login">
        <h2 style="margin-top:0">Analisi Matematica I</h2>
        <p style="color:#666; font-size:14px">Inserire i dati per iniziare la prova</p>
        <input id="nome" type="text" placeholder="Cognome e Nome">
        <!-- PULSANTE AGGANCIATO DIRETTAMENTE A FUNZIONE SEMPLICE -->
        <button type="button" onclick="avviaTest()">INIZIA VALUTAZIONE</button>
        <p onclick="vaiA('v-prof-auth')" style="font-size:12px; color:blue; cursor:pointer; margin-top:15px; text-decoration:underline;">Area Docente</p>
    </div>

    <!-- SCHERMATA QUIZ -->
    <div id="v-quiz" class="hidden">
        <div id="q-progresso" style="font-size:12px; font-weight:bold; color:var(--s)"></div>
        <h3 id="q-testo" style="text-align:left; margin:15px 0"></h3>
        <div id="q-opzioni"></div>
    </div>

    <!-- SCHERMATA RISULTATI -->
    <div id="v-res" class="hidden">
        <h2>Esito Prova</h2>
        <div id="voto-finale" style="font-size:50px; font-weight:bold; margin:20px 0"></div>
        <div id="classifica" style="text-align:left; font-size:14px; border-top:1px solid #eee; padding-top:15px">
            <strong>Risultati Recenti:</strong>
            <div id="lista-voti" style="margin-top:10px"></div>
        </div>
        <button onclick="location.reload()">Esci</button>
    </div>

    <!-- AUTH PROF -->
    <div id="v-prof-auth" class="hidden">
        <h3>Password Docente</h3>
        <input id="pass-prof" type="password">
        <button onclick="loginProf()">Accedi</button>
        <button onclick="vaiA('v-login')" style="background:#666">Annulla</button>
    </div>
</div>

<script>
    // --- CONFIGURAZIONE E ERROR HANDLING ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'test-analisi-v1';
    const log = (msg) => { document.getElementById('debug-log').innerText = "Status: " + msg; };

    let db, auth;
    try {
        const cfg = JSON.parse(__firebase_config);
        firebase.initializeApp(cfg);
        db = firebase.firestore();
        auth = firebase.auth();
        auth.signInAnonymously().catch(e => log("Errore login silente"));
    } catch (e) {
        log("Firebase non caricato correttamente");
    }

    // --- DATI ---
    const domande = [
        { q: "Limite per x→0 di sin(x)/x?", a: ["0", "1", "∞", "Non esiste"], c: 1 },
        { q: "Derivata di x²?", a: ["x", "2x", "2", "x²"], c: 1 },
        { q: "La funzione |x| è derivabile in 0?", a: ["Sì", "No", "Solo a destra", "Solo a sinistra"], c: 1 },
        { q: "Derivata di eˣ?", a: ["xeˣ⁻¹", "eˣ", "ln(x)", "1/eˣ"], c: 1 },
        { q: "f''(x) > 0 indica che la funzione è:", a: ["Crescente", "Decrescente", "Convessa", "Concava"], c: 2 }
    ];

    let indice = 0, punti = 0, utente = "";

    // --- LOGICA ---
    function vaiA(id) {
        document.getElementById('v-login').classList.add('hidden');
        document.getElementById('v-quiz').classList.add('hidden');
        document.getElementById('v-res').classList.add('hidden');
        document.getElementById('v-prof-auth').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    function avviaTest() {
        utente = document.getElementById('nome').value.trim();
        if (utente.length < 3) {
            alert("Inserisci Nome e Cognome.");
            return;
        }
        log("Test avviato");
        indice = 0; punti = 0;
        vaiA('v-quiz');
        mostraDomanda();
    }

    function mostraDomanda() {
        const d = domande[indice];
        document.getElementById('q-progresso').innerText = `DOMANDA ${indice + 1} / ${domande.length}`;
        document.getElementById('q-testo').innerText = d.q;
        const container = document.getElementById('q-opzioni');
        container.innerHTML = "";
        
        d.a.forEach((testo, i) => {
            const div = document.createElement('div');
            div.className = "opt";
            div.innerText = testo;
            div.onclick = () => {
                if(i === d.c) punti++;
                if(++indice < domande.length) mostraDomanda();
                else fineTest();
            };
            container.appendChild(div);
        });
    }

    async function fineTest() {
        const voto = ((punti / domande.length) * 10).toFixed(1);
        document.getElementById('voto-finale').innerText = voto + "/10";
        vaiA('v-res');
        
        if (db) {
            const path = `artifacts/${appId}/public/data/voti`;
            db.collection(path).add({
                nome: utente,
                voto: parseFloat(voto),
                data: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => caricaVoti())
              .catch(e => log("Errore salvataggio"));
        }
    }

    function caricaVoti() {
        const path = `artifacts/${appId}/public/data/voti`;
        db.collection(path).onSnapshot(snap => {
            let html = "";
            let dati = [];
            snap.forEach(doc => dati.push(doc.data()));
            dati.sort((a,b) => b.voto - a.voto);
            dati.slice(0, 5).forEach(d => {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; border-bottom:1px solid #f9f9f9">
                            <span>${d.nome}</span><strong>${d.voto}</strong>
                         </div>`;
            });
            document.getElementById('lista-voti').innerHTML = html || "Nessun record.";
        });
    }

    function loginProf() {
        if(document.getElementById('pass-prof').value === "Prof2026") {
            vaiA('v-res');
            caricaVoti();
        } else alert("Errata.");
    }
</script>

</body>
</html>
