<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Matematica</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --p: #1e293b; --s: #3b82f6; --bg: #f1f5f9; }
        body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; position: relative; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: var(--p); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .opt { border: 1px solid #eee; margin: 8px 0; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; }
        .opt:hover { background: #f8fafc; border-color: var(--s); transform: translateX(5px); }
        #debug-status { position: absolute; top: 10px; right: 10px; font-size: 10px; padding: 4px; border-radius: 4px; font-weight: bold; }
        .online { background: #dcfce7; color: #166534; }
        .offline { background: #fee2e2; color: #991b1b; }
        #q-progresso { font-size: 11px; font-weight: 800; color: var(--s); text-transform: uppercase; margin-bottom: 10px; text-align: left; }
    </style>
</head>
<body>

<div class="box">
    <div id="debug-status" class="offline">DB DISCONNESSO</div>
    
    <div id="v-login">
        <h2 style="margin-top:0; color:var(--p)">Analisi Matematica I</h2>
        <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Inserire Cognome e Nome per iniziare la sessione.</p>
        <input id="nome" type="text" placeholder="Cognome e Nome">
        <button type="button" onclick="avviaTest()" style="width:100%">AVVIA Verifica</button>
        <p onclick="vaiA('v-prof-auth')" style="font-size:12px; color:#94a3b8; cursor:pointer; margin-top:20px; text-decoration:underline;">Accesso Docente</p>
    </div>

    <div id="v-quiz" class="hidden">
        <div id="q-progresso"></div>
        <h3 id="q-testo" style="text-align:left; margin:0 0 20px 0; font-size:18px; line-height:1.4;"></h3>
        <div id="q-opzioni"></div>
    </div>

    <div id="v-res" class="hidden">
        <h2 style="margin-bottom:5px">Esito Prova</h2>
        <div id="voto-finale" style="font-size:56px; font-weight:900; color:var(--p); margin:10px 0"></div>
        <div id="lista-voti" style="margin-top:20px; text-align:left; border-top:1px solid #eee; padding-top:15px"></div>
        <button onclick="location.reload()" style="width:100%; background:#64748b; margin-top:20px;">ESCI E CHIUDI</button>
    </div>

    <div id="v-prof-auth" class="hidden">
        <h3>Registro Elettronico</h3>
        <input id="pass-prof" type="password" placeholder="Password Docente">
        <button onclick="loginProf()" style="width:100%">Accedi</button>
        <button onclick="vaiA('v-login')" style="width:100%; background:#64748b; margin-top:10px;">Indietro</button>
    </div>
</div>

<script>
    // --- CONFIGURAZIONE MANUALE ---
    // Sostituisci il vecchio init con questo
async function initFirebase() {
    const statusEl = document.getElementById('debug-status');
    try {
        const firebaseConfig = {
            apiKey: "AIzaSyDDHFGjW_oiCiP7MhdBRq9vqWHAvjTfDws",
            authDomain: "compito-di-mate.firebaseapp.com",
            projectId: "compito-di-mate",
            storageBucket: "compito-di-mate.firebasestorage.app",
            messagingSenderId: "306562904610",
            appId: "1:306562904610:web:c80a54eea6157e7108507b",
            measurementId: "G-MHV0KWER9G"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        db = firebase.firestore();
        // Importante: attendi il login anonimo
        await firebase.auth().signInAnonymously();

        isFirebaseReady = true;
        statusEl.innerText = "DB CONNESSO";
        statusEl.className = "online";
    } catch (e) {
        console.error("Errore:", e);
        statusEl.innerText = "ERRORE CONNESSIONE";
        statusEl.className = "offline";
    }
}

    const domande = [
        { q: "Qual è il limite per x → 0 di (eˣ - 1) / x?", a: ["0", "1", "e", "∞"], c: 1 },
        { q: "Una funzione f(x) è continua in x₀ se:", a: ["Esiste f(x₀)", "I limiti dx e sx coincidono con f(x₀)", "La derivata è positiva", "f(x₀) > 0"], c: 1 },
        { q: "Data f(x) = x², qual è il coeff. angolare della tangente in x = 3?", a: ["3", "6", "9", "0"], c: 1 },
        { q: "Se f'(x) > 0 in un intervallo, la funzione è:", a: ["Costante", "Crescente", "Decrescente", "Concava"], c: 1 },
        { q: "Cosa indica un punto in cui f''(x) = 0 e cambia segno?", a: ["Massimo", "Minimo", "Flesso", "Asintoto"], c: 2 },
        { q: "Qual è la derivata della funzione f(x) = ln(x)?", a: ["eˣ", "1/x", "x", "1"], c: 1 },
        { q: "Il limite per x → ∞ di (3x² + 2) / (x² - 1) è:", a: ["0", "2", "3", "∞"], c: 2 },
        { q: "Che tipo di discontinuità ha sin(x)/x in x = 0?", a: ["1° specie", "2° specie", "3° specie (eliminabile)", "È continua"], c: 2 },
        { q: "La derivata del prodotto [f(x)g(x)]' è:", a: ["f'g + fg'", "f'g'", "f' + g'", "fg' - f'g"], c: 0 },
        { q: "La funzione f(x) = |x| nel punto x=0 è:", a: ["Derivabile", "Continua ma non derivabile", "Discontinua", "Un flesso"], c: 1 }
    ];

    let indice = 0, punti = 0, utente = "";

    function vaiA(id) {
        document.querySelectorAll('.box > div:not(#debug-status)').forEach(div => div.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function avviaTest() {
        utente = document.getElementById('nome').value.trim();
        if (utente.length < 3) return alert("Inserisci il nome completo.");
        indice = 0; punti = 0;
        vaiA('v-quiz');
        mostraDomanda();
    }

    function mostraDomanda() {
        const d = domande[indice];
        document.getElementById('q-progresso').innerText = `DOMANDA ${indice + 1} DI ${domande.length}`;
        document.getElementById('q-testo').innerText = d.q;
        const container = document.getElementById('q-opzioni');
        container.innerHTML = "";
        d.a.forEach((testo, i) => {
            const div = document.createElement('div');
            div.className = "opt";
            div.innerText = testo;
            div.onclick = () => {
                if(i === d.c) punti++;
                if(++indice < domande.length) mostraDomanda();
                else fineTest();
            };
            container.appendChild(div);
        });
    }

    function fineTest() {
        const voto = ((punti / domande.length) * 10).toFixed(1);
        document.getElementById('voto-finale').innerText = voto + "/10";
        vaiA('v-res');
        
        // Regola 1: Percorso rigoroso per dati pubblici
        if (isFirebaseReady && db) {
            const path = `artifacts/${appId}/public/data/voti`;
            db.collection(path).add({
                nome: utente,
                voto: parseFloat(voto),
                data: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => caricaVoti())
            .catch(err => console.error("Errore salvataggio:", err));
        } else {
            document.getElementById('lista-voti').innerHTML = "<p style='color:orange; font-size:12px'>Voto salvato solo localmente (DB disconnesso).</p>";
        }
    }

    function caricaVoti() {
        if (!db) return;
        // Regola 1 e 2: Percorso corretto e nessuna query complessa (orderBy rimosso per evitare necessità di indici)
        const path = `artifacts/${appId}/public/data/voti`;
        db.collection(path).get().then(snap => {
            let html = "<strong style='font-size:11px; color:#64748b; text-transform:uppercase;'>Graduatoria Studenti:</strong><br><div style='margin-top:10px'>";
            let voti = [];
            snap.forEach(doc => voti.push(doc.data()));
            
            // Ordinamento in JavaScript per evitare errori di permessi/indici
            voti.sort((a, b) => (b.voto || 0) - (a.voto || 0));
            
            voti.slice(0, 10).forEach(d => {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; border-bottom:1px solid #f1f5f9; font-size:14px">
                            <span>${d.nome}</span><strong>${d.voto}</strong>
                         </div>`;
            });
            html += "</div>";
            document.getElementById('lista-voti').innerHTML = html;
        }).catch(err => {
            console.error("Errore caricamento voti:", err);
            document.getElementById('lista-voti').innerHTML = "Errore nel caricamento dei dati.";
        });
    }

    function loginProf() {
        if(document.getElementById('pass-prof').value === "ProfDoc2026") {
            vaiA('v-res');
            caricaVoti();
        } else alert("Password errata.");
    }

    window.onload = initFirebase;
</script>
</body>
</html>
